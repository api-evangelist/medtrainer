- id: fhir
  name: HL7 FHIR (alignment)
  conforms: partial
  evidence:
  - 'openapi/medtrainer-public-api-openapi.json — every 2xx and 4xx response uses media type `application/fhir+json`.'
  - 'components.schemas declares FHIR resource shapes: OperationOutcome, OperationOutcomeIssue, OperationOutcomeDetails, BundleLink, Practitioner, Location, Position.'
  - 'Search operations return FHIR Bundle envelopes (LocationSearchBundle, PractitionerSearchBundle, ...) with `link` relations, and accept the FHIR search parameters `_count`, `_page`, `_elements`.'
  - 'Every error path returns a FHIR OperationOutcome with an `issue[].code` drawn from the FHIR issue-type value set (login, invalid, throttled, exception, not-found).'
  note: >-
    This is the domain-standard signature for the healthcare market and it is declared in the
    CONTRACT, not only in marketing prose. It is recorded as `partial` rather than `true` because
    MedTrainer's own wording is "FHIR-aligned": there is no CapabilityStatement at /metadata
    (probed 2026-08-25, HTTP 401), no declared FHIR release version, and the resources are
    MedTrainer projections of FHIR shapes rather than full FHIR R4/R5 resources.
