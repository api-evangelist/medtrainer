- status: 500
  name: InternalServerError
  issue_code: exception
  title: Unexpected internal error
  examples:
  - An internal server error occurred. Please try again later.
  operations: 21
  remediation: Retry with backoff. Write operations are not idempotent, so a blind retry of a POST may duplicate the resource.
