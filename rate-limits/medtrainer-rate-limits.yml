note: >-
  MedTrainer enforces rate limiting but publishes no numbers. All 21 operations in the
  specification declare a 429 response returning a FHIR OperationOutcome with
  issue[].code = "throttled" and the text "Rate limit exceeded. Please retry after a short
  delay." — but no threshold, no window, no scope (per key / per account / per endpoint), no
  burst allowance and no Retry-After value are stated anywhere in the specification or on the
  published docs page. limit_count is 0 because zero numeric limits are published, not because
  no limiting exists.
