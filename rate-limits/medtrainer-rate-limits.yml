gap: >-
  This is the runtime signal an agent most needs and it is absent. A client that receives a 429
  has no header telling it how long to wait and no documented budget to pace against, so the only
  available strategy is blind exponential backoff — made worse by the absence of idempotency keys
  on the three create operations (see conventions/medtrainer-conventions.yml).
