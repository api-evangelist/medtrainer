apis:
- aid: medtrainer-public-api
  name: MedTrainer Public API
  description: 'The MedTrainer Public API allows external integrations to search and manage
    core directory resources such as locations, divisions, departments, positions, practitioner
    categories and practitioners. Most resource endpoints return FHIR-aligned JSON with the
    application/fhir+json content type, search responses are FHIR Bundles with next/prev
    link relations, and errors are returned as FHIR OperationOutcome documents. Protected
    endpoints accept either an X-API-Key header or an Authorization: Bearer token, with
    keys generated from the API keys manager in the platform Organization settings.'
