envelopes:
  search: 'FHIR Bundle — <Entity>SearchBundle wrapping <Entity>SearchEntry items plus BundleLink navigation.'
  error: 'OperationOutcome — see errors/medtrainer-problem-types.yml.'
gaps:
- 'PractitionerCategory is exposed as a lookup but nothing in the Practitioner schema references a category id, so the relationship the resource name implies is not expressed in the contract.'
- 'DivisionLocationReference uses a FHIR-ish `reference` string while every other link uses {id,name} — two link idioms in one API.'
- 'No entity carries created/updated timestamps or an ETag/version field, so a client cannot do optimistic concurrency or incremental sync.'
