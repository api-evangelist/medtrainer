source: openapi/medtrainer-public-api-openapi.json
summary: >-
  The MedTrainer Public API exposes a provider-directory graph with six entities. Practitioner is
  the hub: it links out to Position, Department, Location and Division. Location and Division are
  linked to each other in both directions. Positions, Departments and Practitioner Categories are
  read-only reference vocabularies. Every entity carries a FHIR-style `resourceType` discriminator
  and an opaque, prefixed public id.
id_conventions:
  style: 'prefixed opaque public id, uppercase prefix + hyphen + sequence'
  prefixes:
  - entity: Location
    prefix: LOC-
    example: LOC-001
  - entity: Division
    prefix: DIV-
    example: DIV-001
  - entity: Position
    prefix: POS-
    example: POS-001
  - entity: Department
    prefix: DEPT-
    example: DEPT-001
  - entity: PractitionerCategory
    prefix: PCAT-
    example: PCAT-001
  - entity: Practitioner
    prefix: PRAC- / EMP-PUB-
    example: PRAC-001
    note: 'Read responses use PRAC-###; the create-success OperationOutcome example returns EMP-PUB-002, exposing the internal employee-id lineage. Two id shapes for one entity is a real ambiguity for an integrator.'
entities:
- name: Location
  resource_type: Location
  writable: true
  operations: [searchLocations, getLocation, createLocation, updateLocation, patchLocation]
  key_fields: [id, name, addressLine, city, state, zipCode, phoneNumber, fax, email, sendEmail, enabledCredentialing]
  pii: false
- name: Division
  resource_type: Division
  writable: true
  operations: [searchDivisions, getDivision, createDivision, updateDivision, patchDivision]
  key_fields: [id, name, locations]
  pii: false
- name: Practitioner
  resource_type: Practitioner
  writable: true
  operations: [searchPractitioners, getPractitioner, createPractitioner, updatePractitioner, patchPractitioner]
  key_fields: [id, name, telecom, birthDate, gender, address, mailingAddress, departments, position, locations, divisions, extension]
  pii: true
  pii_note: >-
    Carries directly identifying personal data — legal name, home address, mailing address, personal
    phone, email, birth date, birth place, and NPI number under extension.provider.npiNumber. Any
    agent or integration touching this entity is handling healthcare workforce PII.
  extensions:
  - path: extension.user
    fields: [status, statusReason, userType]
    constrained_values:
      userType: [admin, super_admin, student]
  - path: extension.provider
    fields: [npiNumber]
  - path: extension.employment
  - path: extension.birthPlace
  - path: extension.fnin
- name: Position
  resource_type: Position
  writable: false
  operations: [searchPositions, getPosition]
  key_fields: [id, name, clinical]
- name: Department
  resource_type: Department
  writable: false
  operations: [searchDepartments, getDepartment]
  key_fields: [id, name]
- name: PractitionerCategory
  resource_type: PractitionerCategory
  writable: false
  operations: [searchPractitionerCategories, getPractitionerCategory]
  key_fields: [id, name]
relationships:
- from: Location
  to: Division
  cardinality: belongs_to
  via: division.id
  evidence: 'Location.division is an embedded {id,name} reference object.'
- from: Location
  to: Location
