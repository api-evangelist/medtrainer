name: MedTrainer MCP Server (WordPress MCP Adapter)
status: published
summary: >-
  MedTrainer serves a live, OAuth-protected remote MCP endpoint from its WordPress
  marketing site at medtrainer.com. It was discovered through RFC 9728 protected-resource
  metadata at https://medtrainer.com/.well-known/oauth-protected-resource, which names
  https://medtrainer.com/wp-json/mcp/mcp-oauth-server as the resource and
  https://medtrainer.com as its authorization server. The WordPress REST route index
  confirms an `mcp` namespace exposing two servers. IMPORTANT SCOPE NOTE: this MCP surface
  belongs to the WordPress content site, not to the MedTrainer Public API at
  api.medtrainer.com. It is a content/site MCP adapter, not a wrapper over the FHIR-aligned
  provider-directory API.
deployment:
  mode: remote
  endpoint: https://medtrainer.com/wp-json/mcp/mcp-oauth-server
  auth: oauth
  verified: probed
