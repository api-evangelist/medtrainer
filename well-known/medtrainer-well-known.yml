source: live GET probes of /.well-known/* on every MedTrainer host in apis.yml
note: >-
  Real hits on two hosts. medtrainer.com (the WordPress marketing site) serves RFC 8414
  authorization-server metadata and RFC 9728 protected-resource metadata that advertise a
  WordPress-hosted MCP server. auth.medtrainer.com (the Auth0-backed platform identity
  provider on MedTrainer's own custom domain) serves a full OpenID Connect discovery
  document. api.medtrainer.com — the MedTrainer Public API host — answers 401 with a FHIR
  OperationOutcome on every path including /.well-known/*, so nothing there is anonymously
  readable. No security.txt and no api-catalog anywhere.
