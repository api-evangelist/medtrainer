components:
  schemas:
    PractitionerLinkedResource:
      type: object
      additionalProperties: false
      description: Related practitioner resource. `name` may be absent when it is not available.
      required:
      - id
      properties:
        id:
          type: string
          example: LOC-420
        name:
          type: string
          example: London Clinic
    PractitionerWriteMailingAddress:
      type: object
      description: "Optional mailing address payload.\n\nThe server enforces:\n  - a character allowlist regex `^[A-Za-z0-9 .'\\-]+$` on `line[0]`,\n    `line[1]`, and `city`\n  - `maxLength: 100` on `county` and `province`\n"
      properties:
        line:
          type: array
          maxItems: 2
          items:
            type: string
            minLength: 1
            maxLength: 150
        city:
          type: string
          minLength: 1
          maxLength: 50
        state:
          type: string
          minLength: 1
          maxLength: 50
        postalCode:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^\d{5}$
          description: Exactly 5 digits.
        country:
          type: string
          minLength: 1
        county:
          type: string
          minLength: 1
          maxLength: 100
        province:
          type: string
          minLength: 1
          maxLength: 100
    PractitionerSearchEntry:
      type: object
      additionalProperties: false
      required:
      - resource
      properties:
        resource:
          $ref: '#/components/schemas/Practitioner'
    PractitionerWriteProviderExtension:
      type: object
      description: 'Optional provider extension payload.

        '
      properties:
        npiNumber:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^\d{10}$
        caqhId:
          type: string
          minLength: 1
          maxLength: 12
        caqhUsername:
          type: string
          minLength: 1
          maxLength: 50
        caqhPassword:
          type: string
          minLength: 1
          maxLength: 50
        caqhLastReattestationDate:
          $ref: '#/components/schemas/MmDdYyyyDateString'
        caqhEmail:
          type: string
          minLength: 1
          format: email
        treatsGender:
          type: string
          minLength: 1
          description: Accepted values are `Male only`, `Female only`, and `Both`.
          enum:
          - Male only
          - Female only
          - Both
        patientAgeMinimum:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 100
          - type: string
            pattern: ^\d+$
            description: Numeric string representing an integer between 0 and 100 inclusive.
          description: Must be an integer (or numeric string) in the range `[0, 100]`. Booleans and non-numeric strings are rejected.
        patientAgeMaximum:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 100
          - type: string
            pattern: ^\d+$
            description: Numeric string representing an integer between 0 and 100 inclusive.
          description: Must be an integer (or numeric string) in the range `[0, 100]`. Booleans and non-numeric strings are rejected.
        upin:
          type: string
          minLength: 1
          maxLength: 6
          pattern: ^[A-Za-z0-9 .'\-]+$
          description: Only letters, numbers, spaces, apostrophes, periods, and hyphens are allowed.
    PractitionerName:
      type: object
      properties:
        given:
          type: string
          example: Ada
        family:
